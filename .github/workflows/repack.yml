name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip zipalign apksigner
          command -v zip
          command -v unzip
          command -v zipalign
          command -v apksigner

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          df -h /

      - name: Get game file
        run: |
          mkdir -p in
          URLS=(
            "https://d.apkpure.com/b/XAPK/com.netease.newspike?version=latest"
            "https://d.apkpure.net/b/XAPK/com.netease.newspike?version=latest"
            "https://d.apkpure.com/b/APK/com.netease.newspike?version=latest"
          )
          ok=0
          for u in "${URLS[@]}"; do
            echo "try: $u"
            rm -f in/game.bin
            if curl -fsSL -A "Mozilla/5.0" --retry 2 --max-time 2400 -o in/game.bin "$u"; then
              if [ "$(head -c 2 in/game.bin)" = "PK" ]; then ok=1; break; fi
            fi
          done
          if [ $ok -eq 0 ]; then echo "DOWNLOAD FAILED"; exit 1; fi
          ls -lh in/

      - name: Repack
        run: bash tools/repack.sh in/game.bin dist

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modded
          path: dist/*
          if-no-files-found: warn
          retention-days: 7
